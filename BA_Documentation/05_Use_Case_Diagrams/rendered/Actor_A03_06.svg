iền: tương tác; không biểu diễn luồng điều khiển.</text><text x="17" y="541.355" fill="#000" font-size="14" textLength="684.811">STAFF: permission theo handler + khu được giao + whitelist controller; không mặc định toàn quyền.</text><text x="17" y="557.844" fill="#000" font-size="14" textLength="530.024">Đường xanh có nhãn: biến thể giới hạn (V), không được toàn bộ mục tiêu UC.</text><text x="17" y="574.332" fill="#000" font-size="14" textLength="624.49">Nhắc nợ: STAFF chỉ BillingController + billing.policy + propertyId; ZNS trực tiếp chỉ Chủ trọ.</text><text x="17" y="590.82" fill="#000" font-size="14" textLength="580.604">E01-E05: hệ thống ngoài có adapter; chỉ tương tác ở nhánh cấu hình/bật tương ứng.</text><text x="17" y="607.309" fill="#000" font-size="14" textLength="703.213">Mặc định: xác minh tĩnh, chưa nghiệm thu runtime; màu vàng: một phần, cam: DEMO, xám: mô phỏng.</text><text x="17" y="623.797" fill="#000" font-size="14" textLength="684.708">Góc nhìn A03: nhãn liệt kê quyền tùy handler, KHÔNG yêu cầu đồng thời mọi quyền; giữ nguyên UC.</text><text x="17" y="640.285" fill="#000" font-size="14" textLength="645.183">Quyền chi tiết, điều kiện và nguồn: Association_Traceability.md / data/diagram-manifest.json.</text></g><g class="caption" data-source-line="33"><text x="322.655" y="675.773" fill="#000" font-size="14" textLength="493.295">AS-IS · 29/10/2026 · Snapshot c565c29 · Không biểu diễn trình tự xử lý</text></g><?plantuml-src ZLPjQnj74FwkNp4uNn9YMT999ycoCKYAP9lKQegSq1SLixvRwxQwsrFlzcohfT0qbD26j0dDbr92xPeGaiOa8O5G7wNGC_uVzqywUoVB9rbkwm-ojJlppCpppCpQf5i2X0qEwne2TEPGJJ2RfzmUuttY40jqkaKyKpHjBbh4ej0ct6rJXsrDjscpBoZayedBJQBrkexjSRrkcxO3bvhbPhLPJrYu1j7j7SQxi4LCboPkgevZxmpTLALOA5KdBzSDflKuTLt89Qw89codBGOc1LUWWKNuv6tDTdJg3B6LGhwgAfCcifv_DQYTAotwIPXvBjM8I-7B5C15rdYJp2MlbEhbF9ucmsVpQg5s7cDnSItqVnRGDyAZftnfASBCrXlZcEUjQhdIVAuq3UzQO-tz2AVUKAyr9t5ERsjrTJvVdPfFy0Xkh8J-3wrbQTWeDQhDtBbqnesAzLAXN4vzbU1DzY7XNVC2vXgDPg6fJZ8t56cSkVWiYIsOCEbvSgSOnCrSJbnnMwSkxOEY9fCbl2SFYsegSe