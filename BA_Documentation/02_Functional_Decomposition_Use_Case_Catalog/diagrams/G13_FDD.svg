nction"><rect x="480" y="758" width="450" height="56" rx="6"/><text x="494" y="780">G13.3</text><text x="494" y="799">Kháng nghị, chính sách và chất lượng</text></g><g class="group"><rect x="70" y="498.5" width="350" height="77" rx="6"/><text x="84" y="520.5">G13 · 11 UC</text><text x="84" y="539.5">Kiểm duyệt và chất lượng nội</text><text x="84" y="558.5">dung</text></g></svg>
