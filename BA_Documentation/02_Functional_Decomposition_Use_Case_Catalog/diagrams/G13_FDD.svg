<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1018" viewBox="0 0 1800 1018" role="img" aria-labelledby="title desc"><title id="title">Phân rã chức năng hệ thống nhà trọ AS-IS</title><desc id="desc">Sơ đồ phân cấp chức năng. Không phải UML Use Case Diagram. Cùng dữ liệu với catalog 162 UC.</desc><style>text{font-family:DejaVu Sans,Noto Sans,sans-serif;font-size:15px;fill:#173d43}.root rect{fill:#173d43;stroke:#173d43}.root text{fill:#fff;font-size:19px}.group rect{fill:#e0ebe4;stroke:#52756a}.function rect{fill:#eef1e8;stroke:#a5b3a2}.goal rect{fill:#fffdf7;stroke:#bdc8bc}.edges path{fill:none;stroke:#839c91;stroke-width:1.5}</style><rect width="1800" height="1018" fill="#f6f5ee"/><g class="root"><rect x="20" y="20" width="1750" height="70" rx="8"/><text x="40" y="50">Hệ thống quản lý và tìm thuê nhà trọ — Functional Decomposition</text><text x="40" y="76">AS-IS · 29/10/2026 · nhóm → chức năng → mục tiêu · không thể hiện Actor hoặc thứ tự xử lý</text></g><g class="edges"><path d="M 40 90 V 948"/><path d="M 970 177 H 1000"/><path d="M 970 243 H 1000"/><path d="M 970 309 H 1000"/><path d="M 930 243 H 970 M 970 177 V 309"/><path d="M 970 399 H 1000"/><path d="M 970 465 H 1000"/><path d="M 970 531 H 1000"/><path d="M 970 597 H 1000"/><path d="M 930 498 H 970 M 970 399 V 597"/><path d="M 970 687 H 1000"/><path d="M 970 753 H 1000"/><path d="M 970 819 H 1000"/><path d="M 970 885 H 1000"/><path d="M 930 786 H 970 M 970 687 V 885"/><path d="M 40 537 H 70 M 420 537 H 450 M 450 243 V 786"/><path d="M 450 243 H 480"/><path d="M 450 498 H 480"/><path d="M 450 786 H 480"/></g><g class="goal"><rect x="1000" y="150" width="770" height="54" rx="6"/><text x="1014" y="172">UC-DIS-07 · AS-IS</text><text x="1014" y="191">Báo cáo tin phòng không phù hợp</text></g><g class="goal"><rect x="1000" y="216" width="770" height="54" rx="6"/><text x="1014" y="238">UC-DIS-12 · AS-IS</text><text x="1014" y="257">Viết sửa và rút đánh giá phòng đã thuê</text></g><g class="goal"><rect x