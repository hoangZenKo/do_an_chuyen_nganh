al"><rect x="1000" y="306" width="770" height="54" rx="6"/><text x="1014" y="328">UC-DIS-03 · AS-IS</text><text x="1014" y="347">Lưu và bỏ lưu phòng yêu thích</text></g><g class="goal"><rect x="1000" y="372" width="770" height="54" rx="6"/><text x="1014" y="394">UC-DIS-04 · AS-IS</text><text x="1014" y="413">Lưu bộ lọc và theo dõi tin khớp</text></g><g class="function"><rect x="480" y="338" width="450" height="56" rx="6"/><text x="494" y="360">G02.2</text><text x="494" y="379">Lưu nhu cầu và theo dõi tin</text></g><g class="goal"><rect x="1000" y="462" width="770" height="54" rx="6"/><text x="1014" y="484">UC-DIS-16 · AS-IS</text><text x="1014" y="503">So sánh các phòng quan tâm</text></g><g class="goal"><rect x="1000" y="528" width="770" height="54" rx="6"/><text x="1014" y="550">UC-DIS-17 · AS-IS</text><text x="1014" y="569">Ước tính chi phí thuê phòng</text></g><g class="function"><rect x="480" y="494" width="450" height="56" rx="6"/><text x="494" y="516">G02.3</text><text x="494" y="535">Đánh giá lựa chọn</text></g><g class="group"><rect x="70" y="343" width="350" height="58" rx="6"/><text x="84" y="365">G02 · 6 UC</text><text x="84" y="384">Tìm và lựa chọn phòng</text></g></svg>
