<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1084" viewBox="0 0 1800 1084" role="img" aria-labelledby="title desc"><title id="title">Phân rã chức năng hệ thống nhà trọ AS-IS</title><desc id="desc">Sơ đồ phân cấp chức năng. Không phải UML Use Case Diagram. Cùng dữ liệu với catalog 162 UC.</desc><style>text{font-family:DejaVu Sans,Noto Sans,sans-serif;font-size:15px;fill:#173d43}.root rect{fill:#173d43;stroke:#173d43}.root text{fill:#fff;font-size:19px}.group rect{fill:#e0ebe4;stroke:#52756a}.function rect{fill:#eef1e8;stroke:#a5b3a2}.goal rect{fill:#fffdf7;stroke:#bdc8bc}.edges path{fill:none;stroke:#839c91;stroke-width:1.5}</style><rect width="1800" height="1084" fill="#f6f5ee"/><g class="root"><rect x="20" y="20" width="1750" height="70" rx="8"/><text x="40" y="50">Hệ thống quản lý và tìm thuê nhà trọ — Functional Decomposition</text><text x="40" y="76">AS-IS · 29/10/2026 · nhóm → chức năng → mục tiêu · không thể hiện Actor hoặc thứ tự xử lý</text></g><g class="edges"><path d="M 40 90 V 1014"/><path d="M 970 177 H 1000"/><path d="M 970 243 H 1000"/><path d="M 970 309 H 1000"/><path d="M 970 375 H 1000"/><path d="M 970 441 H 1000"/><path d="M 970 507 H 1000"/><path d="M 970 573 H 1000"/><path d="M 930 375 H 970 M 970 177 V 573"/><path d="M 970 663 H 1000"/><path d="M 970 729 H 1000"/><path d="M 930 696 H 970 M 970 663 V 729"/><path d="M 970 819 H 1000"/><path d="M 970 885 H 1000"/><path d="M 970 951 H 1000"/><path d="M 930 885 H 970 M 970 819 V 951"/><path d="M 40 570 H 70 M 420 570 H 450 M 450 375 V 885"/><path d="M 450 375 H 480"/><path d="M 450 696 H 480"/><path d="M 450 885 H 480"/></g><g class="goal"><rect x="1000" y="150" width="770" height="54" rx="6"/><text x="1014" y="172">UC-ADM-02 · AS-IS</text><text x="1014" y="191">Tra cứu tài khoản nền tảng</text></g><g class="goal"><rect x="1000" y="216" width="770" height="54" rx="6"/><text x="1014" y="238">UC-ADM-03.1 · Một phần</text><text x="1014" y="257">Tạo hoặc mời tài khoản chủ trọ</text></g><g class="goal"><rect x="1000" y="282" width="770" height="54" rx="6"/><text x="1014" y="304">UC-ADM-03.2 · AS-IS</text><text x="1014" y="323">Cập nhật hồ sơ chủ trọ</text></g><g class="goal"><rect x="1000" y="348" width="770" height="54" rx="6"/><text x="1014" y="370">UC-ADM-04.1 · AS-IS</text><text x="1014" y="389">Đình chỉ hoặc khôi phục tài khoản</text></g><g class="goal"><rect x="1000" y="414" width="770" height="54" rx="6"/><text x="1014" y="436">UC-ADM-04.3 · AS-IS</text><text x="1014" y="455">Thu hồi phiên của tài khoản khác</text></g><g class="goal"><rect x="1000" y="480" width="770" height="54" rx="6"/><text x="1014" y="502">UC-ADM-05.1 · AS-IS</text><text x="1014" y="521">Mở thông tin cá nhân được che</text></g><g class="goal"><rect x="1000" y="546" width="770" height="54" rx="6"/><text x="1014" y="568">UC-ADM-05.2 · Một phần</text><text x="1014" y="587">Yêu cầu khôi phục truy cập cho tài khoản</text></g><g class="function"><rect x="480" y="347" width="450" height="56" rx="6"/><text x="494" y="369">G12.1</text><text x="494" y="388">Tài khoản khách hàng</text></g><g class="goal"><rect x="1000" y="636" width="770" height="54" rx="6"/><text x="1014" y="658">UC-ADM-06.1 · Một phần</text><text x="1014" y="677">Cấp và quản lý quyền quản trị viên</text></g><g class="goal"><rect x="1000" y="702" width="770" height="54" rx="6"/><text x="1014" y="724">UC-ADM-06.2 · AS-IS</text><text x="1014" y="743">Rà soát quyền Admin định kỳ</text></g><g class="function"><rect x="480" y="668" width="450" height="56" rx="6"/><text x="494" y="690">G12.2</text><text x="494" y="709">Nhân sự quản trị và rà soát quyền</text></g><g class="goal"><rect x="1000" y="792" width="770" height="54" rx="6"/><text x="1014" y="814">UC-ADM-08 · AS-IS</text><text x="1014" y="833">Tra cứu khu và phòng toàn nền tảng</text></g><g class="goal"><rect x="1000" y="858" width="770" height="54" rx="6"/><text x="1014" y="880">UC-ADM-09 · AS-IS</text><text x="1014" y="899">Tạo hoặc cập nhật khu thay chủ trọ</tex