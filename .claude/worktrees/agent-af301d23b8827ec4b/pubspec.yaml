name: rental_room_management
description: A Flutter app for landlords to manage rental properties, buildings, rooms, tenants, and billing.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.7
  go_router: ^14.6.2
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
  assets:
    - assets/images/atrium_living_logo.png
    - assets/images/zalo_logo.png
    - assets/images/rooms/
