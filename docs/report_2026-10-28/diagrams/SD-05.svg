<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1040" viewBox="0 0 1320 1040"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="black" stroke-width="1.5"/></marker></defs><rect x="13" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="135" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Chủ trọ/Staff</text><line x1="135" y1="87" x2="135" y2="895" stroke="black" stroke-dasharray="9 7"/><rect x="348" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="470" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Flutter</text><line x1="470" y1="87" x2="470" y2="895" stroke="black" stroke-dasharray="9 7"/><rect x="683" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="805" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">BillingService</text><line x1="805" y1="87" x2="805" y2="895" stroke="black" stroke-dasharray="9 7"/><rect x="1063" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="1185" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Prisma/DB</text><line x1="1185" y1="87" x2="1185" y2="895" stroke="black" stroke-dasharray="9 7"/><line x1="135" y1="153" x2="470" y2="153" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="115" text-anchor="middle" font-family="Times New Roman" font-size="24">1. Chọn hợp đồng/kỳ và chỉ số</text><line x1="470" y1="229" x2="805" y2="229" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="191" text-anchor="middle" font-family="Times New Roman" font-size="24">2. POST invoices/preview hoặc</text><text x="637.5" y="218" text-anchor="middle" font-family="Times New Roman" font-size="24">bulk/preflight</text><line x1="805" y1="305" x2="1185" y2="305" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="267" text-anchor="middle" font-family="Times New Roman" font-size="24">3. Đọc lease, meter readings</text><text x="995.0" y="294" text-anchor="middle" font-family="Times New Roman" font-size="24">và tariffs</text><path d="M805,358 h65 v25 h-65" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="343" text-anchor="middle" font-family="Times New Roman" font-size="24">4. Tính các dòng có nguồn giá</text><line x1="805" y1="457" x2="470" y2="457" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="419" text-anchor="middle" font-family="Times New Roman" font-size="24">5. Preview hoặc lỗi từng</text><text x="637.5" y="446" text-anchor="middle" font-family="Times New Roman" font-size="24">phòng</text><line x1="135" y1="533" x2="470" y2="533" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="495" text-anchor="middle" font-family="Times New Roman" font-size="24">6. Xác nhận phát hành</text><line x1="470" y1="609" x2="805" y2="609" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="571" text-anchor="middle" font-family="Times New Roman" font-size="24">7. POST invoices hoặc</text><text x="637.5" y="598" text-anchor="middle" font-family="Times New Roman" font-size="24">invoices/bulk</text><line x1="805" y1="685" x2="1185" y2="685" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="647" text-anchor="middle" font-family="Times New Roman" font-size="24">8. Kiểm tra trùng và điều</text><text x="995.0" y="674" text-anchor="middle" font-family="Times New Roman" font-size="24">kiện hiện tại</text><line x1="805" y1="761" x2="1185" y2="761" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="723" text-anchor="middle" font-family="Times New Roman" font-size="24">9. Ghi Invoice,</text><text x="995.0" y="750" text-anchor="middle" font-family="Times New Roman" font-size="24">InvoiceLineItem</text><line x1="805" y1="837" x2="470" y2="837" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="799" text-anchor="middle" font-family="Times New Roman" font-size="24">10. Kết quả tạo/bỏ qua/lỗi</text><rect x="15" y="912" width="1290" height="102" fill="white" stroke="black" stroke-width="1.5"/><text x="35" y="943" font-family="Times New Roman" font-size="24">Preflight không giữ khóa tới lần ghi. Không sửa hóa đơn quá khứ theo biểu phí mới; không</text><text x="35" y="973" font-family="Times New Roman" font-size="24">coi bulk thành công tuyệt đối khi có lỗi.</text></svg>