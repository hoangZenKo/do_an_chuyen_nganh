or="middle" font-family="Times New Roman" font-size="24">3. Đọc lease, công nợ và</text><text x="995.0" y="294" text-anchor="middle" font-family="Times New Roman" font-size="24">ledger cọc</text><line x1="805" y1="381" x2="470" y2="381" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="343" text-anchor="middle" font-family="Times New Roman" font-size="24">4. Snapshot, fingerprint,</text><text x="637.5" y="370" text-anchor="middle" font-family="Times New Roman" font-size="24">chênh lệch</text><line x1="135" y1="457" x2="470" y2="457" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="419" text-anchor="middle" font-family="Times New Roman" font-size="24">5. Xác nhận preview</text><line x1="470" y1="533" x2="805" y2="533" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="495" text-anchor="middle" font-family="Times New Roman" font-size="24">6. POST confirm +</text><text x="637.5" y="522" text-anchor="middle" font-family="Times New Roman" font-size="24">fingerprint/requestKey</text><line x1="805" y1="609" x2="1185" y2="609" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="571" text-anchor="middle" font-family="Times New Roman" font-size="24">7. Khóa và đối chiếu snapshot</text><line x1="805" y1="685" x2="1185" y2="685" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="647" text-anchor="middle" font-family="Times New Roman" font-size="24">8. Ghi settlement/lines, cập</text><text x="995.0" y="674" text-anchor="middle" font-family="Times New Roman" font-size="24">nhật lease/room</text><line x1="135" y1="761" x2="470" y2="761" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="723" text-anchor="middle" font-family="Times New Roman" font-size="24">9. Ghi khoản đã hoàn sau xác</text><text x="302.5" y="750" text-anchor="middle" font-family="Times New Roman" font-size="24">nhận</text><line x1="470" y1="837" x2="805" y2="837" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="799" text-anchor="middle" font-family="Times New Roman" font-size="24">10. POST settlement/refund</text><line x1="805" y1="913" x2="1185" y2="913" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="875" text-anchor="middle" font-family="Times New Roman" font-size="24">11. Ghi sổ, không chuyển tiền</text><text x="995.0" y="902" text-anchor="middle" font-family="Times New Roman" font-size="24">ngân hàng</text><rect x="15" y="988" width="1290" height="72" fill="white" stroke="black" stroke-width="1.5"/><text x="35" y="1019" font-family="Times New Roman" font-size="24">Snapshot đổi hoặc lệnh trùng khác nội dung → dừng. Luồng settlement chỉ dành LANDLORD.</text></svg>