t-family="Times New Roman" font-size="24">3. Đọc tài khoản, phiên và</text><text x="995.0" y="294" text-anchor="middle" font-family="Times New Roman" font-size="24">chính sách</text><line x1="1185" y1="381" x2="805" y2="381" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="343" text-anchor="middle" font-family="Times New Roman" font-size="24">4. Tài khoản và trạng thái</text><path d="M805,434 h65 v25 h-65" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="419" text-anchor="middle" font-family="Times New Roman" font-size="24">5. Xác minh mật khẩu; MFA nếu</text><text x="905" y="446" text-anchor="middle" font-family="Times New Roman" font-size="24">Admin</text><line x1="805" y1="533" x2="1185" y2="533" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="495" text-anchor="middle" font-family="Times New Roman" font-size="24">6. Ghi session và refresh</text><text x="995.0" y="522" text-anchor="middle" font-family="Times New Roman" font-size="24">token</text><line x1="805" y1="609" x2="470" y2="609" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="571" text-anchor="middle" font-family="Times New Roman" font-size="24">7. Token, role, capabilities</text><path d="M470,662 h65 v25 h-65" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="570" y="647" text-anchor="middle" font-family="Times New Roman" font-size="24">8. Lưu phiên an toàn; điều hướng</text><line x1="470" y1="761" x2="805" y2="761" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="723" text-anchor="middle" font-family="Times New Roman" font-size="24">9. Refresh khi token hết hạn</text><line x1="805" y1="837" x2="1185" y2="837" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="799" text-anchor="middle" font-family="Times New Roman" font-size="24">10. Luân chuyển token; kiểm</text><text x="995.0" y="826" text-anchor="middle" font-family="Times New Roman" font-size="24">tra thu hồi</text><rect x="15" y="912" width="1290" height="102" fill="white" stroke="black" stroke-width="1.5"/><text x="35" y="943" font-family="Times New Roman" font-size="24">Sai mật khẩu/MFA → không tạo phiên. Refresh bị thu hồi → yêu cầu đăng nhập; lỗi mạng không</text><text x="35" y="973" font-family="Times New Roman" font-size="24">đồng nhất tài khoản bị khóa.</text></svg>