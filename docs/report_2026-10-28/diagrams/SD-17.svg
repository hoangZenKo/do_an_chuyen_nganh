<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="964" viewBox="0 0 1320 964"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="black" stroke-width="1.5"/></marker></defs><rect x="13" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="135" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Chủ trọ</text><line x1="135" y1="87" x2="135" y2="819" stroke="black" stroke-dasharray="9 7"/><rect x="348" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="470" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Flutter Chatbot</text><line x1="470" y1="87" x2="470" y2="819" stroke="black" stroke-dasharray="9 7"/><rect x="683" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="805" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">ChatbotService</text><line x1="805" y1="87" x2="805" y2="819" stroke="black" stroke-dasharray="9 7"/><rect x="1063" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="1185" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Tri thức/Tools</text><line x1="1185" y1="87" x2="1185" y2="819" stroke="black" stroke-dasharray="9 7"/><line x1="135" y1="153" x2="470" y2="153" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="115" text-anchor="middle" font-family="Times New Roman" font-size="24">1. Gửi câu hỏi và propertyId</text><line x1="470" y1="229" x2="805" y2="229" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="191" text-anchor="middle" font-family="Times New Roman" font-size="24">2. POST chatbot/ask</text><path d="M805,282 h65 v25 h-65" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="267" text-anchor="middle" font-family="Times New Roman" font-size="24">3. Kiểm tra role và rate limit</text><line x1="805" y1="381" x2="1185" y2="381" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="343" text-anchor="middle" font-family="Times New Roman" font-size="24">4. Truy xuất nguồn đã cho</text><text x="995.0" y="370" text-anchor="middle" font-family="Times New Roman" font-size="24">phép</text><line x1="805" y1="457" x2="1185" y2="457" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="419" text-anchor="middle" font-family="Times New Roman" font-size="24">5. Gọi tool đọc nghiệp vụ nếu</text><text x="995.0" y="446" text-anchor="middle" font-family="Times New Roman" font-size="24">phù hợp</text><path d="M805,510 h65 v25 h-65" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="495" text-anchor="middle" font-family="Times New Roman" font-size="24">6. Tổng hợp, giữ scope và nguồn</text><line x1="805" y1="609" x2="470" y2="609" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="571" text-anchor="middle" font-family="Times New Roman" font-size="24">7. Câu trả lời và tham chiếu</text><line x1="470" y1="685" x2="805" y2="685" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="647" text-anchor="middle" font-family="Times New Roman" font-size="24">8. GET nguồn qua endpoint bảo</text><text x="637.5" y="674" text-anchor="middle" font-family="Times New Roman" font-size="24">vệ</text><line x1="805" y1="761" x2="470" y2="761" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="723" text-anchor="middle" font-family="Times New Roman" font-size="24">9. Nội dung nguồn được phép</text><rect x="15" y="836" width="1290" height="102" fill="white" stroke="black" stroke-width="1.5"/><text x="35" y="867" font-family="Times New Roman" font-size="24">Controller chỉ LANDLORD. Không có nguồn/model sẵn sàng → nói rõ giới hạn; không tự bịa số</text><text x="35" y="897" font-family="Times New Roman" font-size="24">liệu hoặc thực thi lệnh ghi.</text></svg>