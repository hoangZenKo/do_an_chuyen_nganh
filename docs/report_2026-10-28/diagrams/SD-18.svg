<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1040" viewBox="0 0 1320 1040"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="black" stroke-width="1.5"/></marker></defs><rect x="13" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="135" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Admin</text><line x1="135" y1="87" x2="135" y2="895" stroke="black" stroke-dasharray="9 7"/><rect x="348" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="470" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Flutter Admin</text><line x1="470" y1="87" x2="470" y2="895" stroke="black" stroke-dasharray="9 7"/><rect x="683" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="805" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">VerificationService</text><line x1="805" y1="87" x2="805" y2="895" stroke="black" stroke-dasharray="9 7"/><rect x="1063" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="1185" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Prisma/DB</text><line x1="1185" y1="87" x2="1185" y2="895" stroke="black" stroke-dasharray="9 7"/><line x1="135" y1="153" x2="470" y2="153" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="115" text-anchor="middle" font-family="Times New Roman" font-size="24">1. Mở hàng đợi xác minh</text><line x1="470" y1="229" x2="805" y2="229" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="191" text-anchor="middle" font-family="Times New Roman" font-size="24">2. GET landlord-verifications</text><line x1="805" y1="305" x2="1185" y2="305" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="267" text-anchor="middle" font-family="Times New Roman" font-size="24">3. Đọc projection, trang và</text><text x="995.0" y="294" text-anchor="middle" font-family="Times New Roman" font-size="24">trạng thái</text><line x1="135" y1="381" x2="470" y2="381" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="343" text-anchor="middle" font-family="Times New Roman" font-size="24">4. Nhập quyết định, lý do,</text><text x="302.5" y="370" text-anchor="middle" font-family="Times New Roman" font-size="24">version</text><line x1="470" y1="457" x2="805" y2="457" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="419" text-anchor="middle" font-family="Times New Roman" font-size="24">5. POST verification/review</text><line x1="805" y1="533" x2="1185" y2="533" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="495" text-anchor="middle" font-family="Times New Roman" font-size="24">6. Đọc chủ trọ, ticket và</text><text x="995.0" y="522" text-anchor="middle" font-family="Times New Roman" font-size="24">minh chứng</text><path d="M805,586 h65 v25 h-65" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="571" text-anchor="middle" font-family="Times New Roman" font-size="24">7. Kiểm tra PENDING, version, tự</text><text x="905" y="598" text-anchor="middle" font-family="Times New Roman" font-size="24">duyệt</text><line x1="805" y1="685" x2="1185" y2="685" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="647" text-anchor="middle" font-family="Times New Roman" font-size="24">8. Update có điều kiện và</text><text x="995.0" y="674" text-anchor="middle" font-family="Times New Roman" font-size="24">audit</text><line x1="805" y1="761" x2="470" y2="761" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="723" text-anchor="middle" font-family="Times New Roman" font-size="24">9. Kết quả và version mới</text><line x1="470" y1="837" x2="135" y2="837" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="799" text-anchor="middle" font-family="Times New Roman" font-size="24">10. Cập nhật hàng đợi</text><rect x="15" y="912" width="1290" height="102" fill="white" stroke="black" stroke-width="1.5"/><text x="35" y="943" font-family="Times New Roman" font-size="24">Khi APPROVED phải có chủ trọ hoạt động và chứng cứ SUPPORT_CLEAN. Xung đột version hoặc</text><text x="35" y="973" font-family="Times New Roman" font-size="24">chứng cứ không hợp lệ: rollback, đọc lại hồ sơ.</text></svg>