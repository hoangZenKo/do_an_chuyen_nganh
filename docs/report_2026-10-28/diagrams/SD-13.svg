<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1116" viewBox="0 0 1320 1116"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="black" stroke-width="1.5"/></marker></defs><rect x="13" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="135" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Chủ trọ/Staff</text><line x1="135" y1="87" x2="135" y2="971" stroke="black" stroke-dasharray="9 7"/><rect x="348" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="470" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Flutter</text><line x1="470" y1="87" x2="470" y2="971" stroke="black" stroke-dasharray="9 7"/><rect x="683" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="805" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">ReportsService</text><line x1="805" y1="87" x2="805" y2="971" stroke="black" stroke-dasharray="9 7"/><rect x="1063" y="15" width="244" height="72" fill="white" stroke="black" stroke-width="2"/><text x="1185" y="44" text-anchor="middle" font-family="Times New Roman" font-size="25">Prisma/DB</text><line x1="1185" y1="87" x2="1185" y2="971" stroke="black" stroke-dasharray="9 7"/><line x1="135" y1="153" x2="470" y2="153" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="115" text-anchor="middle" font-family="Times New Roman" font-size="24">1. Chọn tháng/khu</text><line x1="470" y1="229" x2="805" y2="229" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="191" text-anchor="middle" font-family="Times New Roman" font-size="24">2. GET reports/monthly</text><line x1="805" y1="305" x2="1185" y2="305" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="267" text-anchor="middle" font-family="Times New Roman" font-size="24">3. Kiểm tra</text><text x="995.0" y="294" text-anchor="middle" font-family="Times New Roman" font-size="24">ownership/property scope</text><line x1="805" y1="381" x2="1185" y2="381" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="995.0" y="343" text-anchor="middle" font-family="Times New Roman" font-size="24">4. Đọc invoice, payment,</text><text x="995.0" y="370" text-anchor="middle" font-family="Times New Roman" font-size="24">expense, cọc</text><path d="M805,434 h65 v25 h-65" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="419" text-anchor="middle" font-family="Times New Roman" font-size="24">5. Tổng hợp theo các mốc thời gian</text><text x="905" y="446" text-anchor="middle" font-family="Times New Roman" font-size="24">riêng</text><line x1="805" y1="533" x2="470" y2="533" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="495" text-anchor="middle" font-family="Times New Roman" font-size="24">6. Summary, nhóm và danh sách</text><text x="637.5" y="522" text-anchor="middle" font-family="Times New Roman" font-size="24">invoices</text><line x1="135" y1="609" x2="470" y2="609" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="571" text-anchor="middle" font-family="Times New Roman" font-size="24">7. Chọn xuất CSV</text><line x1="470" y1="685" x2="805" y2="685" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="647" text-anchor="middle" font-family="Times New Roman" font-size="24">8. GET monthly/export; quyền</text><text x="637.5" y="674" text-anchor="middle" font-family="Times New Roman" font-size="24">riêng</text><line x1="805" y1="761" x2="470" y2="761" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="723" text-anchor="middle" font-family="Times New Roman" font-size="24">9. filename, mimeType và</text><text x="637.5" y="750" text-anchor="middle" font-family="Times New Roman" font-size="24">content</text><path d="M470,814 h65 v25 h-65" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="570" y="799" text-anchor="middle" font-family="Times New Roman" font-size="24">10. Clipboard.setData(content)</text><line x1="470" y1="913" x2="135" y2="913" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="302.5" y="875" text-anchor="middle" font-family="Times New Roman" font-size="24">11. Thông báo đã copy CSV</text><rect x="15" y="988" width="1290" height="102" fill="white" stroke="black" stroke-width="1.5"/><text x="35" y="1019" font-family="Times New Roman" font-size="24">Không đồng nhất Payment ròng với toàn bộ Receipt; không mô tả clipboard thành XLSX/PDF đã</text><text x="35" y="1049" font-family="Times New Roman" font-size="24">lưu.</text></svg>