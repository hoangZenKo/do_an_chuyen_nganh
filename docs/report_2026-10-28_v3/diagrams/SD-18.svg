PostgreSQL</text><line x1="1215.0" y1="147" x2="1215.0" y2="1193" stroke="#8A8A8A" stroke-dasharray="7 6" stroke-width="1.2"/><rect x="455.6666666666667" y="209" width="12" height="952" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="832.3333333333334" y="256" width="12" height="145" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="1209.0" y="303" width="12" height="51" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="455.6666666666667" y="444" width="12" height="717" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="832.3333333333334" y="491" width="12" height="623" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="1209.0" y="538" width="12" height="51" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="838.3333333333334" y="769" width="12" height="16" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="838.3333333333334" y="953" width="12" height="16" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="1209.0" y="1016" width="12" height="51" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><line x1="85.0" y1="211" x2="461.6666666666667" y2="211" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="147.33333333333337" y="180" width="252.0" height="25" fill="white"/><text x="273.33333333333337" y="202" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">1. Mở hàng đợi và hồ sơ</text><line x1="461.6666666666667" y1="258" x2="838.3333333333334" y2="258" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="582.0" y="227" width="136.0" height="25" fill="white"/><text x="650.0" y="249" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">2. list(query)</text><line x1="838.3333333333334" y1="305" x2="1215.0" y2="305" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="863.6666666666667" y="274" width="326.0" height="25" fill="white"/><text x="1026.6666666666667" y="296" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">3. Đọc projection và phân trang</text><line x1="1215.0" y1="352" x2="838.3333333333334" y2="352" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="912.6666666666667" y="321" width="228.0" height="25" fill="white"/><text x="1026.6666666666667" y="343" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">4. Hồ sơ cùng version</text><line x1="838.3333333333334" y1="399" x2="461.6666666666667" y2="399" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="515.5" y="368" width="269.0" height="25" fill="white"/><text x="650.0" y="390" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">5. Dữ liệu được phép xem</text><line x1="85.0" y1="446" x2="461.6666666666667" y2="446" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="90.33333333333337" y="415" width="366.0" height="25" fill="white"/><text x="273.33333333333337" y="437" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">6. Nhập decision, reason và version</text><line x1="461.6666666666667" y1="493" x2="838.3333333333334" y2="493" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="550.0" y="462" width="200.0" height="25" fill="white"/><text x="650.0" y="484" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">7. review(id, input)</text><line x1="838.3333333333334" y1="540" x2="1215.0" y2="540" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="797.03125" y="509" width="458.96875" height="25" fill="white"/><text x="1026.515625" y="531" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">8. TX: đọc identity; khóa User, Ticket và file</text><line x1="1215.0" y1="587" x2="838.3333333333334" y2="587" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="871.1666666666667" y="556" width="311.0" height="25" fill="white"/><text x="1026.6666666666667" y="578" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">9. Hồ sơ / chứng cứ hiện hành</text><line x1="838.3333333333334" y1="671" x2="461.6666666666667" y2="671" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="508.5" y="640" width="283.0" height="25" fill="white"/><text x="650.0" y="662" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">10. 403 / 409; đọc lại hồ sơ</text><path d="M844.3333333333334,767 h75 v13 h-75" fill="none" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="526.3489583333334" y="740" width="623.96875" height="25" fill="white"/><text x="838.3333333333334" y="762" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">11. Kiểm tra active, chủ ticket, merge và SUPPORT_CLEAN</text><line x1="838.3333333333334" y1="855" x2="461.6666666666667" y2="855" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="520.0" y="824" width="260.0" height="25" fill="white"/><text x="650.0" y="846" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">12. 400; không xác minh</text><path d="M844.3333333333334,951 h75 v13 h-75" fill="none" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="620.8333333333334" y="924" width="435.0" height="25" fill="white"/><text x="838.3333333333334" y="946" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">13. Giữ lý do; không xác nhận thành công</text><line x1="838.3333333333334" y1="1018" x2="1215.0" y2="1018" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="591.0" y="987" width="665.0" height="25" fill="white"/><text x="923.5" y="1009" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">14. updateMany theo version và PENDING; audit hash chứng cứ</text><line x1="1215.0" y1="1065" x2="838.3333333333334" y2="1065" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="856.6666666666667" y="1034" width="340.0" height="25" fill="white"/><text x="1026.6666666666667" y="1056" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">15. Commit status và version + 1</text><line x1="838.3333333333334" y1="1112" x2="461.6666666666667" y2="1112" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="493.0" y="1081" width="314.0" height="25" fill="white"/><text x="650.0" y="1103" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">16. Quyết định và version mới</text><line x1="461.6666666666667" y1="1159" x2="85.0" y2="1159" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="113.33333333333337" y="1128" width="320.0" height="25" fill="white"/><text x="273.33333333333337" y="1150" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">17. Làm mới hàng đợi và hồ sơ</text></svg>