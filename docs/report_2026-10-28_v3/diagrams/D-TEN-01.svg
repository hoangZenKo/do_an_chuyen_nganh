<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><rect width="100%" height="100%" fill="white"/><text x="600" y="36" text-anchor="middle" font-family="Times New Roman" font-size="26" font-weight="bold">Cổng thông tin người thuê — phần 1</text><rect x="180" y="70" width="840" height="920" fill="white" stroke="#20242b" stroke-width="2"/><text x="600" y="106" text-anchor="middle" font-family="Times New Roman" font-size="24" font-weight="bold">Hệ thống quản lý nhà trọ</text><line x1="82" y1="738" x2="280" y2="160" stroke="#acb5c4" stroke-width="1.3"/><line x1="82" y1="738" x2="280" y2="270" stroke="#acb5c4" stroke-width="1.3"/><line x1="82" y1="738" x2="280" y2="380" stroke="#acb5c4" stroke-width="1.3"/><line x1="82" y1="738" x2="280" y2="490" stroke="#acb5c4" stroke-width="1.3"/><line x1="82" y1="738" x2="280" y2="600" stroke="#acb5c4" stroke-width="1.3"/><line x1="82" y1="738" x2="280" y2="710" stroke="#acb5c4" stroke-width="1.3"/><line x1="82" y1="738" x2="280" y2="820" stroke="#acb5c4" stroke-width="1.3"/><ellipse cx="600" cy="160" rx="320" ry="44" fill="white" stroke="#22A95A" stroke-width="2"/><text x="600" y="155" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="bold">UC-TEN-01</text><text x="600" y="180" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal">Xem hồ sơ và tổng quan thuê của mình</text><ellipse cx="600" cy="270" rx="320" ry="44" fill="white" stroke="#22A95A" stroke-width="2"/><text x="600" y="265" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="bold">UC-TEN-02</text><text x="600" y="290" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal">Xem hợp đồng lịch sử cọc và quyết toán</text><ellipse cx="600" cy="380" rx="320" ry="44" fill="white" stroke="#22A95A" stroke-width="2"/><text x="600" y="375" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="bold">UC-TEN-03</text><text x="600" y="400" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal">Xem hóa đơn và chia sẻ PDF của mình</text><ellipse cx="600" cy="490" rx="320" ry="44" fill="white" stroke="#22A95A" stroke-width="2"/><text x="600" y="485" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="bold">UC-TEN-04</text><text x="600" y="510" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal">Tải tệp và gửi chứng từ thanh toán</text><ellipse cx="600" cy="600" rx="320" ry="44" fill="white" stroke="#22A95A" stroke-width="2"/><text x="600" y="595" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="bold">UC-TEN-05</text><text x="600" y="620" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal">Thanh toán qua cổng thẻ mô phỏng</text><ellipse cx="600" cy="710" rx="320" ry="44" fill="white" stroke="#22A95A" stroke-width="2"/><text x="600" y="705" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="bold">UC-TEN-06</text><text x="600" y="730" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal">Gửi và phản hồi yêu cầu bảo trì</text><ellipse cx="600" cy="820" rx="320" ry="44" fill="white" stroke="#22A95A" stroke-width="2"/><text x="600" y="815" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="bold">UC-TEN-07</text><text x="600" y="840" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal">Gửi hủy và theo dõi yêu cầu vòng đời thuê</text><circle cx="82" cy="700" r="15.299999999999999" fill="white" stroke="#20242b" stroke-width="3"/><line x1="82" y1="715.3" x2="82" y2="762.05" stroke="#20242b" stroke-width="3"/><line x1="53.1" y1="732.3" x2="110.9" y2="732.3" stroke="#20242b" stroke-width="3"/><line x1="82" y1="762.05" x2="56.5" y2="797.75" stroke="#20242b" stroke-width="3"/><line x1="82" y1="762.05" x2="