action</text><line x1="838.3333333333334" y1="934" x2="1215.0" y2="934" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="807.6666666666667" y="903" width="438.0" height="25" fill="white"/><text x="1026.6666666666667" y="925" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">13. Giảm available; event, audit, command</text><line x1="1215.0" y1="981" x2="838.3333333333334" y2="981" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="880.6666666666667" y="950" width="292.0" height="25" fill="white"/><text x="1026.6666666666667" y="972" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">14. Commit receipt và số dư</text><line x1="838.3333333333334" y1="1028" x2="461.6666666666667" y2="1028" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="435.5" y="997" width="429.0" height="25" fill="white"/><text x="650.0" y="1019" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">15. Receipt, allocations, availableAmount</text><line x1="461.6666666666667" y1="1112" x2="838.3333333333334" y2="1112" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="443.0" y="1081" width="414.0" height="25" fill="white"/><text x="650.0" y="1103" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">16. allocate(receiptId, lines, requestKey)</text><line x1="838.3333333333334" y1="1159" x2="1215.0" y2="1159" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="691.0" y="1128" width="565.0" height="25" fill="white"/><text x="973.5" y="1150" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">17. Khóa receipt; áp dụng kiểm tra và phân bổ như trên</text><line x1="1215.0" y1="12