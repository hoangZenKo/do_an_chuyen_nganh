k</text><text x="116" y="708" text-anchor="start" font-family="Times New Roman" font-size="24" font-weight="normal" text-decoration="none">[Sai loại hoặc credit vượt số dư]</text><circle cx="85.0" cy="33" r="12" fill="#FFFFB9" stroke="#800000" stroke-width="1.6"/><path d="M85.0,45 v34 m-26,-23 h52 m-26,23 l-23,27 m23,-27 l23,27" fill="none" stroke="#800000" stroke-width="1.7"/><text x="85.0" y="128" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">Chủ trọ</text><line x1="85.0" y1="147" x2="85.0" y2="1099" stroke="#8A8A8A" stroke-dasharray="7 6" stroke-width="1.2"/><circle cx="461.6666666666667" cy="54" r="29" fill="#FFFFB9" stroke="#800000" stroke-width="1.7"/><path d="M418.6666666666667,27 v54 m0,-27 h14" fill="none" stroke="#800000" stroke-width="1.7"/><text x="461.6666666666667" y="128" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="underline">Giao diện Flutter</text><line x1="461.6666666666667" y1="147" x2="461.6666666666667" y2="1099" stroke="#8A8A8A" stroke-dasharray="7 6" stroke-width="1.2"/><circle cx="838.3333333333334" cy="54" r="29" fill="#FFFFB9" stroke="#800000" stroke-width="1.7"/><path d="M847.3333333333334,20 l-17,5 l14,12" fill="none" stroke="#800000" stroke-width="1.7"/><text x="838.3333333333334" y="128" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="underline">BillingLedgerService</text><line x1="838.3333333333334" y1="147" x2="838.3333333333334" y2="1099" stroke="#8A8A8A" stroke-dasharray="7 6" stroke-width="1.2"/><path d="M1183.0,33 v43 a32,10 0 0 0 64,0 V33" fill="#FFFFB9" stroke="#800000" stroke-width="1.7"/><ellipse cx="1215.0" cy="33" rx="32" ry="10" fill="#FFFFB9" stroke="#800000" stroke-width="1.7"/><text x="1215.0" y="128" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="underline">PostgreSQL</text><line x1="121