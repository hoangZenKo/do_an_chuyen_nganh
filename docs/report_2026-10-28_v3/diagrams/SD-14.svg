"middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">4. User và sessionVersion</text><line x1="838.3333333333334" y1="436" x2="461.6666666666667" y2="436" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="493.5" y="405" width="313.0" height="25" fill="white"/><text x="650.0" y="427" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">5. 404 / 409; tải lại, không ghi</text><line x1="838.3333333333334" y1="520" x2="1215.0" y2="520" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="838.6901041666667" y="489" width="375.953125" height="25" fill="white"/><text x="1026.6666666666667" y="511" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">6. Đổi isActive; tăng sessionVersion</text><line x1="1215.0" y1="567" x2="838.3333333333334" y2="567" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="876.6666666666667" y="536" width="300.0" height="25" fill="white"/><text x="1026.6666666666667" y="558" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">7. User mới trong transaction</text><line x1="838.3333333333334" y1="614" x2="1215.0" y2="614" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="649.0" y="583" width="607.0" height="25" fill="white"/><text x="952.5" y="605" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">8. Thu hồi sessions, refresh, access-link và phiên phụ thuộc</text><line x1="1215.0" y1="661" x2="838.3333333333334" y2="661" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="896.6666666666667" y="630" width="260.0" height="25" fill="white"/><text x="1026.6666666666667" y="652" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">9. Số bản ghi theo policy</text><line x1="838.3333333333334" y1="708" x2="1215.0" y2="708" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="835.6666666666667" y="677" width="382.0" height="25" fill="white"/><text x="1026.6666666666667" y="699" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">10. Ghi adminAudit với before / after</text><line x1="1215.0" y1="755" x2="838.3333333333334" y2="755" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="851.1744791666667" y="724" width="350.984375" height="25" fill="white"/><text x="1026.6666666666667" y="746" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">11. Commit toàn bộ hoặc rollback</text><line x1="838.3333333333334" y1="802" x2="461.6666666666667" y2="802" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="508.0078125" y="771" width="283.984375" height="25" fill="white"/><text x="650.0" y="793" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">12. Account projection mới</text><line x1="461.6666666666667" y1="849" x2="85.0" y2="849" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="106.33333333333337" y="818" width="334.0" height="25" fill="white"/><text x="273.33333333333337" y="840" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">13. Cập nhật danh sách và detail</text><line x1="85.0" y1="949" x2="461.6666666666667" y2="949" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="125.33333333333337" y="918" width="296.0" height="25" fill="white"/><text x="273.33333333333337" y="940" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">14. Chọn khôi phục và lý do</text><line x1="461.6666666666667" y1="996" x2="838.3333333333334" y2="996" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="463.0" y="965" width="374.0" height="25" fill="white"/><text x="650.0" y="987" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">15. status(id, version, isActive=true)</text><line x1="838.3333333333334" y1="1043" x2="1215.0" y2="1043" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="795.0" y="1012" width="461.0" height="25" fill="white"/><text x="1025.5" y="1034" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">16. Kiểm tra lại; đổi trạng thái, version; audit</text><line x1="1215.0" y1="1090" x2="838.3333333333334" y2="1090" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="810.6666666666667" y="1059" width="432.0" height="25" fill="white"/><text x="1026.6666666666667" y="1081" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">17. Tài khoản active, token cũ vẫn thu hồi</text><line x1="838.3333333333334" y1="1137" x2="461.6666666666667" y2="1137" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="419.5078125" y="1106" width="460.984375" height="25" fill="white"/><text x="650.0" y="1128" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">18. Trạng thái mới; cần đăng nhập phiên mới</text></svg>