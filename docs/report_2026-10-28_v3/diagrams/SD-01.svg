eight="normal" text-decoration="none">6. Xác minh mã MFA / mã khôi phục</text><line x1="838.3333333333334" y1="620" x2="461.6666666666667" y2="620" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="469.015625" y="589" width="361.96875" height="25" fill="white"/><text x="650.0" y="611" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">7. MFA_REQUIRED / lỗi xác thực</text><line x1="838.3333333333334" y1="699" x2="1215.0" y2="699" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="608.0" y="668" width="648.0" height="25" fill="white"/><text x="932.0" y="690" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">8. TX: khóa User; kiểm tra version; tạo session và refresh token</text><line x1="1215.0" y1="746" x2="838.3333333333334" y2="746" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="870.6666666666667" y="715" width="312.0" height="25" fill="white"/><text x="1026.6666666666667" y="737" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">9. Commit phiên và hạn token</text><line x1="838.3333333333334" y1="793" x2="461.6666666666667" y2="793" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="462.0078125" y="762" width="375.984375" height="25" fill="white"/><text x="650.0" y="784" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">10. Access token, refresh token, user</text><path d="M467.6666666666667,836 h75 v13 h-75" fill="none" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="260.1744791666667" y="809" width="402.984375" height="25" fill="white"/><text x="461.6666666666667" y="831" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">11. Lưu phiên an toàn; mở đúng vai trò</text><line x1="461.6666666666667" y1="924" x2="838.3333333333334" y2="924" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="534.515625" y="893" width="230.96875" height="25" fill="white"/><text x="650.0" y="915" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">12. refresh(rawToken)</text><line x1="838.3333333333334" y1="971" x2="1215.0" y2="971" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="818.6666666666667" y="940" width="416.0" height="25" fill="white"/><text x="1026.6666666666667" y="962" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">13. TX: khóa User; đọc token và session</text><line x1="1215.0" y1="1018" x2="838.3333333333334" y2="1018" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="849.1979166666667" y="987" width="354.9375" height="25" fill="white"/><text x="1026.6666666666667" y="1009" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">14. Trạng thái, hạn và userVersion</text><line x1="838.3333333333334" y1="1102" x2="461.6666666666667" y2="1102" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="491.5" y="1071" width="317.0" height="25" fill="white"/><text x="650.0" y="1093" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">15. 401; yêu cầu đăng nhập lại</text><line x1="838.3333333333334" y1="1165" x2="1215.0" y2="1165" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="820.1666666666667" y="1134" width="413.0" height="25" fill="white"/><text x="1026.6666666666667" y="1156" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">16. Thu hồi token 