"/><text x="791.25" y="1128" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">18. 409; giữ nguyên đối soát</text><line x1="932.5" y1="1200" x2="1215.0" y2="1200" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="701.015625" y="1169" width="554.984375" height="25" fill="white"/><text x="978.5078125" y="1191" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">19. Cập nhật line, tăng version; proposal APPROVED</text><line x1="932.5" y1="1284" x2="1215.0" y2="1284" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="897.75" y="1253" width="352.0" height="25" fill="white"/><text x="1073.75" y="1275" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">20. Proposal REJECTED; giữ line</text><line x1="1215.0" y1="1347" x2="932.5" y2="1347" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="896.75" y="1316" width="354.0" height="25" fill="white"/><text x="1073.75" y="1338" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">21. Commit cùng audit quyết định</text><line x1="932.5" y1="1394" x2="650.0" y2="1394" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="647.25" y="1363" width="288.0" height="25" fill="white"/><text x="791.25" y="1385" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">22. Proposal và line hiện tại</text></svg>