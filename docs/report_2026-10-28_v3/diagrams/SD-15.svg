"1.1"/><rect x="455.6666666666667" y="779" width="12" height="16" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="832.3333333333334" y="826" width="12" height="339" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="1209.0" y="873" width="12" height="51" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="1209.0" y="1067" width="12" height="51" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><rect x="461.6666666666667" y="1208" width="12" height="16" fill="#FFFFB9" stroke="#800000" stroke-width="1.1"/><line x1="85.0" y1="211" x2="461.6666666666667" y2="211" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="101.83333333333337" y="180" width="343.0" height="25" fill="white"/><text x="273.33333333333337" y="202" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">1. Lọc khu / phòng và phân trang</text><line x1="461.6666666666667" y1="258" x2="838.3333333333334" y2="258" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="467.0" y="227" width="366.0" height="25" fill="white"/><text x="650.0" y="249" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">2. GET admin inventory theo query</text><line x1="838.3333333333334" y1="305" x2="1215.0" y2="305" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="793.0" y="274" width="463.0" height="25" fill="white"/><text x="1024.5" y="296" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">3. Kiểm tra scope; đọc projection có masking</text><line x1="1215.0" y1="352" x2="838.3333333333334" y2="352" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="859.1666666666667" y="321" width="335.0" height="25" fill="white"/><text x="1026.6666666666667" y="343" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">4. Danh sách và meta phân trang</text><line x1="838.3333333333334" y1="399" x2="461.6666666666667" y2="399" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="442.0" y="368" width="416.0" height="25" fill="white"/><text x="650.0" y="390" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">5. Inventory cùng trạng thái listing riêng</text><line x1="85.0" y1="446" x2="461.6666666666667" y2="446" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="105.83333333333337" y="415" width="335.0" height="25" fill="white"/><text x="273.33333333333337" y="437" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">6. Chọn tin PENDING cần xử lý</text><line x1="461.6666666666667" y1="530" x2="85.0" y2="530" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="44.0" y="499" width="476.0" height="25" fill="white"/><text x="282.0" y="521" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">7. Ẩn / chặn hành động; không gửi quyết định</text><line x1="461.6666666666667" y1="593" x2="838.3333333333334" y2="593" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="457.0" y="562" width="386.0" height="25" fill="white"/><text x="650.0" y="584" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">8. Tìm queue theo exact listing UUID</text><line x1="838.3333333333334" y1="640" x2="1215.0" y2="640" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="809.6666666666667" y="609" width="434.0" height="25" fill="white"/><text x="1026.6666666666667" y="631" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">9. Đọc mục kiểm duyệt và trạng thái claim</t