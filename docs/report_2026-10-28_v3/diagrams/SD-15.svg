 stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="884.1744791666667" y="891" width="284.984375" height="25" fill="white"/><text x="1026.6666666666667" y="913" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">15. Trạng thái trước khi ghi</text><line x1="838.3333333333334" y1="1006" x2="461.6666666666667" y2="1006" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="463.0" y="975" width="374.0" height="25" fill="white"/><text x="650.0" y="997" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">16. 409; tải lại, không áp quyết định</text><line x1="838.3333333333334" y1="1069" x2="1215.0" y2="1069" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="896.6666666666667" y="1038" width="260.0" height="25" fill="white"/><text x="1026.6666666666667" y="1060" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">17. Ghi decision và audit</text><line x1="1215.0" y1="1116" x2="838.3333333333334" y2="1116" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="896.1666666666667" y="1085" width="261.0" height="25" fill="white"/><text x="1026.6666666666667" y="1107" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">18. Commit trạng thái tin</text><line x1="838.3333333333334" y1="1163" x2="461.6666666666667" y2="1163" stroke="#800000" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="529.0" y="1132" width="242.0" height="25" fill="white"/><text x="650.0" y="1154" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">19. Kết quả kiểm duyệt</text><path d="M467.6666666666667,1206 h75 v13 h-75" fill="none" stroke="#800000" stroke-width="1.4" marker-end="url(#call)"/><rect x="274.1666666666667" y="1179" width="375.0" height="25" fill="white"/><text x="461.6666666666667" y="1201" text-anchor="middle" font-family="Times New Roman" font-size="25" font-weight="normal" text-decoration="none">20. Invalidate inventory khi quay lại</text></svg>