idation</tspan></text><text font-family="Tahoma, sans-serif" font-size="21" text-anchor="middle" x="600.0" y="745" fill="#181818"><tspan x="600.0" dy="0">Tiếp nhận yêu cầu · Xác thực · Phân quyền · Kiểm tra dữ liệu</tspan></text><path d="M 600 765 L 600 818" fill="none" stroke="#800000" stroke-width="1.7" marker-end="url(#arrow)"/><text font-family="Tahoma, sans-serif" font-size="21" text-anchor="start" x="114" y="801" fill="#181818" font-weight="bold"><tspan x="114" dy="0">Các mô-đun nghiệp vụ / Services</tspan></text><rect x="105" y="818" width="990" height="230" fill="#FFFFFF" stroke="#800000" stroke-width="1.6"/><rect x="125" y="835" width="300" height="90" fill="#FFFFB9" stroke="#800000" stroke-width="1.6"/><text font-family="Tahoma, sans-serif" font-size="20" text-anchor="middle" x="275.0" y="865" fill="#181818" font-weight="bold"><tspan x="275.0" dy="0">Khu trọ và phòng</tspan></text><text font-family="Tahoma, sans-serif" font-size="18" text-anchor="middle" x="275.0" y="901" fill="#181818"><tspan x="275.0" dy="0">Properties · Rooms</tspan></text><rect x="445" y="835" width="300" height="90" fill="#FFFFB9" stroke="#800000" stroke-width="1.6"/><text font-family="Tahoma, sans-serif" font-size="20" text-anchor="middle" x="595.0" y="865" fill="#181818" font-weight="bold"><tspan x="595.0" dy="0">Người thuê và hợp đồng</tspan></text><text font-family="Tahoma, sans-serif" font-size="18" text-anchor="middle" x="595.0" y="901" fill="#181818"><tspan x="595.0" dy="0">Tenants · Leases</tspan></text><rect x="765" y="835" width="300" height="90" fill="#FFFFB9" stroke="#800000" stroke-width="1.6"/><text font-family="Tahoma, sans-serif" font-size="20" text-anchor="middle" x="915.0" y="865" fill="#181818" font-weight="bold"><tspan x="915.0" dy="0">Hóa đơn và thanh toán</tspan></text><text font-family="Tahoma, sans-serif" font-size="18" text-anchor="middle" x="915.0" y="901" fill="#181818"><tspan x="915.0" dy="0">Billing</tspan></text><rect x="125" y="940" width="300" height="9