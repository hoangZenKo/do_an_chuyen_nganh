<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" role="img"><title>CD-06 Thông báo và nhật ký</title><desc>Domain/Entity Class Diagram; association, bội số và vai trò theo schema; IDRef chỉ là mã tham chiếu.</desc><rect width="1240" height="1060" fill="white"/><text x="620.0" y="32" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">CD-06  Thông báo và nhật ký</text><text x="620.0" y="67" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Thực thể, thuộc tính và liên kết dữ liệu; không mô tả chiều gọi hàm</text><polyline points="700,300 550,300 550,220 440,220" fill="none" stroke="#536579" stroke-width="1.4"/><polyline points="700,180 440,180" fill="none" stroke="#536579" stroke-width="1.4"/><polyline points="240,480 240,246" fill="none" stroke="#536579" stroke-width="1.4"/><rect x="40" y="480" width="400" height="136" fill="white" stroke="#364354" stroke-width="1.4"/><rect x="40" y="480" width="400" height="44" fill="#E4ECF6" stroke="#364354" stroke-width="1.4"/><text x="240.0" y="500" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">NotificationRead</text><text x="51" y="541.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">id: String {id}</text><text x="51" y="567.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">notificationId: String</text><text x="51" y="593.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">readAt: DateTime</text><rect x="700" y="480" width="470" height="318" fill="white" stroke="#364354" stroke-width="1.4"/><rect x="700" y="480" width="470" height="44" fill="#E4ECF6" stroke="#364354" stroke-width="1.4"/><text x="935.0" y="500" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">NotificationDelivery</text><text x="711" y="541.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">id: String {id}</text><text x="711" y="567.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">landlordId: String</text><text x="711" y="593.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">tenantId: String [0..1]</text><text x="711" y="619.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">invoiceId: String [0..1]</text><text x="711" y="645.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">channel: NotificationDeliveryChannel</text><text x="711" y="671.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">purpose: String</text><text x="711" y="697.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">recipient: String</text><text x="711" y="723.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">status: NotificationDeliveryStatus</text><text x="711" y="749.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">sentAt: DateTime [0..1]</text><text x="711" y="775.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">errorCode: String [0..1]</text><rect x="700" y="120" width="470" height="240" fill="white" stroke="#364354" stroke-width="1.4"/><rect x="700" y="120" width="470" height="44" fill="#E4ECF6" stroke="#364354" stroke-width="1.4"/><text x="935.0" y="140" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">AuditLog</text><text x="711" y="181.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">id: String {id}</text><text x="711" y="207.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">actorRole: UserRole</text><text x="711" y="233.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">action: String</text><text x="711" y="259.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">resourceType: String</text><text x="711" y="285.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">resourceId: String [0..1]</text><text x="711" y="311.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">summary: String</text><text x="711" y="337.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">createdAt: DateTime</text><rect x="40" y="120" width="400" height="126" fill="white" stroke="#364354" stroke-width="1.4"/><rect x="40" y="120" width="400" height="60" fill="#EEF1F4" stroke="#364354" stroke-width="1.4"/><text x="240.0" y="140" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">User</text><text x="240.0" y="164" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">«reference» — cùng lớp/đối tượng</text><text x="51" y="197.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">id: String {id}</text><text x="51" y="223.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">fullName: String</text><rect x="40" y="680" width="470" height="125" fill="#FFFDF2" stroke="#8A826D"/><text x="50" y="698" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">NotificationRead</text><text x="50" y="723" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">{unique: user, notificationId}</text><text x="50" y="749" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">notificationId có thể là mã tổng hợp;</text><text x="50" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">không có association đến Delivery.</text><rect x="700" y="840" width="470" height="170" fill="#FFFDF2" stroke="#8A826D"/><text x="710" y="858" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">&lt;&lt;IDRef&gt;&gt; — quy ước chú thích</text><text x="710" y="883" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">landlordId → User.id</text><text x="710" y="909" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">tenantId → Tenant.id; invoiceId → Invoice.id</text><text x="710" y="935" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Tham chiếu bằng mã định danh trong dữ liệu;</text><text x="710" y="961" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">không phải structural association UML.</text><rect x="655.0" y="255.5" width="42.0" height="29.0" fill="white"/><text x="676.0" y="270.0" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">0..*</text><rect x="441.0" y="250.5" width="46.0" height="29.0" fill="white"/><text x="464.0" y="265.0" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">0..1</text><rect x="655.0" y="135.5" width="42.0" height="29.0" fill="white"/><text x="676.0" y="150.0" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">0..*</text><rect x="453.0" y="135.5" width="46.0" height="29.0" fill="white"/><text x="476.0" y="150.0" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">0..1</text><rect x="189.0" y="441.5" width="42.0" height="29.0" fill="white"/><text x="210.0" y="456.0" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">0..*</text><rect x="199.0" y="255.5" width="22.0" height="29.0" fill="white"/><text x="210.0" y="270.0" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">1</text><rect x="479.0" y="205.5" width="87.0" height="29.0" fill="white"/><text x="522.5" y="220.0" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">landlord</text><rect x="541.0" y="165.5" width="58.0" height="29.0" fill="white"/><text x="570.0" y="180.0" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">actor</text><rect x="214.0" y="407.0" width="52.0" height="29.0" fill="white"/><text x="240.0" y="421.5" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">user</text><text x="620.0" y="1042" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đường liền: association. Nhãn liên kết: role từ lớp nguồn. &lt;&lt;IDRef&gt;&gt; không phải association.</text></svg>