<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="550" viewBox="0 0 1260 550" role="img"><title>CD-04C Lập hóa đơn định kỳ</title><desc>Domain/Entity Class Diagram; association, bội số và vai trò theo schema; IDRef chỉ là mã tham chiếu.</desc><rect width="1260" height="550" fill="white"/><text x="630.0" y="32" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">CD-04C  Lập hóa đơn định kỳ</text><text x="630.0" y="67" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Thực thể, thuộc tính và liên kết dữ liệu; không mô tả chiều gọi hàm</text><polyline points="470,230 450,230 450,180 380,180 360,180" fill="none" stroke="#536579" stroke-width="1.4"/><polyline points="790,230 810,230 810,180 880,180 900,180" fill="none" stroke="#536579" stroke-width="1.4"/><rect x="470" y="120" width="320" height="214" fill="white" stroke="#364354" stroke-width="1.4"/><rect x="470" y="120" width="320" height="44" fill="#E4ECF6" stroke="#364354" stroke-width="1.4"/><text x="630.0" y="140" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">BillingAutomation</text><text x="481" y="181.0" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">id: String {id}</text><text x="481" y="207.0" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">isEnabled: Boolean</text><text x="481" y="233.0" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">invoiceDay: Int</text><text x="481" y="259.0" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">dueDay