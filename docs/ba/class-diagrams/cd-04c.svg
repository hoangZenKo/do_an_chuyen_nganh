ll="#222222">id: String {id}</text><text x="911" y="223.0" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">name: String</text><rect x="470" y="365" width="520" height="120" fill="#FFFDF2" stroke="#8A826D"/><text x="480" y="383" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">Cấu hình theo khu trọ</text><text x="480" y="408" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Property có tối đa một cấu hình.</text><text x="480" y="431" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Lưu cấu hình ≠ đã chạy lịch.</text><text x="480" y="454" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Vận hành lịch cần được xác nhận.</text><rect x="428.0" y="187.5" width="36.0" height="25.0" fill="white"/><text x="446.0" y="200.0" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">0..*</text><rect x="374.5" y="137.5" width="19.0" height="25.0" fill="white"/><text x="384.0" y="150.0" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">1</text><rect x="795.0" y="187.5" width="38.0" height="25.0" fill="white"/><text x="814.0" y="200.0" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">0..1</text><rect x="866.5" y="137.5" width="19.0" height="25.0" fill="white"/><text x="876.0" y="150.0" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">1</text><rect x="365.0" y="232.5" width="69.0" height="25.0" fill="white"/><text x="399.5" y="245.0" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">landlord</text><rect x="823.0" y="232.5" width="72.0" height="25.0" fill="white"/><text x="859.0" y="245.0" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">property</text><text x="630.0" y="532" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đường liền: association. Nhãn liên kết: role từ lớp nguồn. &lt;&lt;IDRef&gt;&gt; không phải association.</text></svg>