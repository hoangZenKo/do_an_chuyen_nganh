>[Khu không thuộc quyền hoặc đã lưu trữ]</text><text x="1062.5" y="762" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">7: Khu trọ không đủ điều kiện</text><text x="697.5" y="824" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">8: Từ chối xem báo cáo</text><text x="106.5" y="711" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">break</text><text x="94.5" y="511" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">opt</text><text x="1427.5" y="930" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">9: Tra cứu số liệu báo cáo</text><text x="1427.5" y="959" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">tháng</text><text x="1427.5" y="1021" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">10: Số liệu thu chi cọc và hợp</text><text x="1427.5" y="1050" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">đồng</text><text x="1269" y="1112" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">11: Tổng hợp và phân nhóm</text><text x="1062.5" y="1189" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">12: Báo cáo tháng đã tổng</text><text x="1062.5" y="1218" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">hợp</text><text x="697.5" y="1251" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">13: Số liệu theo phạm vi</text><text x="146" y="1311" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Kỳ có dữ liệu tài chính]</text><text x="332.5" y="1360" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">14: Hiển thị báo cáo tháng</text><text x="75" y="1430" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Không có phát sinh trong kỳ]</text><text x="332.5" y="1479" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">15: Hiển thị số tiền bằng 0</text><text x="94.5" y="1309" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="150.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal">Chủ trọ</text><text x="515.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Màn hình báo cáo</text><text x="880.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">ReportsController</text><text x="1245.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">ReportsService</text><text x="1610.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Cơ sở dữ liệu</text></svg>