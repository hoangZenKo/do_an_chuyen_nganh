th="1.5" stroke-dasharray="6 5" marker-end="url(#open)" /><polyline points="1238,1430 887,1430" fill="none" stroke="#800000" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#open)" /><polyline points="873,1569 522,1569" fill="none" stroke="#800000" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#open)" /><polyline points="508,1631 157,1631" fill="none" stroke="#800000" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#open)" /><text x="332.5" y="194" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">1: Xác nhận hoàn tất</text><text x="697.5" y="256" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">2: Gửi thông tin hoàn tất bảo</text><text x="697.5" y="285" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">trì</text><text x="1062.5" y="347" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">3: Yêu cầu hoàn tất bảo trì</text><text x="1427.5" y="409" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">4: Tra cứu yêu cầu thuộc quản</text><text x="1427.5" y="438" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">lý</text><text x="1427.5" y="500" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">5: Yêu cầu và khoản chi liên</text><text x="1427.5" y="529" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">kết</text><text x="146" y="589" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Không tìm thấy yêu cầu hoặc chi phí hay ngày hoàn tất không hợp lệ]</text><text x="1062.5" y="638" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">6: Yêu cầu hoặc dữ liệu không</text><text x="1062.5" y="667" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">hợp lệ</text><text x="697.5" y="729" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">7: Từ chối hoàn tất</text><text x="75" y="799" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Dữ liệu hợp lệ]</text><text x="1269" y="848" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">8: Xác định chi phí và ngày</text><text x="1269" y="877" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">hoàn tất</text><text x="1427.5" y="954" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">9: Bắt đầu ghi nhận nghiệp vụ</text><text x="158" y="1014" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Chọn ghi khoản chi, chi phí &gt; 0 và chưa có khoản chi liên kết]</text><text x="1427.5" y="1063" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">10: Ghi nhận khoản chi sửa</text><text x="1427.5" y="1092" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">chữa</text><text x="1427.5" y="1154" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">11: Khoản chi sửa chữa mới</text><text x="106.5" y="1012" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">opt</text><text x="1427.5" y="1238" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">12: Lưu yêu cầu bảo trì đã</text><text x="1427.5" y="1267" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">hoàn tất</text><text x="1427.5" y="1329" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">13: Kết quả hoàn tất đã được</text><text x="1427.5" y="1358" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">lưu</text><text x="1062.5" y="1420" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">14: Hoàn tất bảo trì</text><text x="820.0" y="1479" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">ref</text><text x="1278.0" y="1489" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Ghi nhật ký hoàn tất bảo trì</text><text x="697.5" y="1559" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">15: Yêu cầu bảo trì đã hoàn</text><text x="697.5" y="1588" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">tất</text><text x="332.5" y="1621" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">16: Hiển thị chi phí</text><text x="94.5" y="587" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="150.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal">Chủ trọ</text><text x="515.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Biểu mẫu hoàn tất</text><text x="880.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">MaintenanceController</text><text x="1245.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">MaintenanceService</text><text x="1610.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Cơ sở dữ liệu</text></svg>