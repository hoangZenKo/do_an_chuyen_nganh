ông đủ điều kiện</text><text x="697.5" y="643" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">7: Không chấp nhận tạo lời</text><text x="697.5" y="672" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">mời</text><text x="332.5" y="705" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">8: Hiển thị lỗi</text><text x="75" y="775" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Hồ sơ hợp lệ]</text><text x="1427.5" y="824" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">9: Tra cứu tài khoản theo</text><text x="1427.5" y="853" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">email</text><text x="1427.5" y="886" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">10: Kết quả kiểm tra email</text><text x="158" y="946" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Email đã đăng ký]</text><text x="1062.5" y="995" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">11: Email đã được đăng ký</text><text x="697.5" y="1057" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">12: Không chấp nhận tạo lời</text><text x="697.5" y="1086" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">mời</text><text x="87" y="1156" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Email chưa đăng ký]</text><text x="1269" y="1205" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">13: Tạo mã kích hoạt</text><text x="1427.5" y="1282" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">14: Lưu lời mời kích hoạt</text><text x="1427.5" y="1344" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">15: Lời mời đã được lưu</text><text x="1062.5" y="1406" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">16: Mã và đường dẫn kích</text><text x="1062.5" y="1435" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">hoạt</text><text x="697.5" y="1468" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">17: Lời mời đã tạo</text><text x="332.5" y="1530" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">18: Hiển thị mã kích hoạt</text><text x="106.5" y="944" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="94.5" y="530" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="150.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal">Chủ trọ</text><text x="515.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Màn hình hồ sơ người</text><text x="515.0" y="166" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">thuê</text><text x="880.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor=