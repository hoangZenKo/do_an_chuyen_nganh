amily="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">chứng</text><text x="1427.5" y="347" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">3: Tra cứu hồ sơ đang sử</text><text x="1427.5" y="376" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">dụng</text><text x="1427.5" y="409" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">4: Hồ sơ Người thuê</text><text x="146" y="469" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Không có hồ sơ Người thuê đang dùng]</text><text x="1062.5" y="518" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">5: Không có hồ sơ người thuê</text><text x="697.5" y="580" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">6: Từ chối gửi minh chứng</text><text x="94.5" y="467" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">break</text><text x="1427.5" y="664" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">7: Tra cứu hóa đơn và số dư</text><text x="1427.5" y="726" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">8: Hóa đơn và số còn phải thu</text><text x="146" y="786" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Hóa đơn không thuộc người thuê, đã hủy hoặc không còn số phải thu]</text><text x="1427.5" y="835" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">9: Hủy các thay đổi chưa lưu</text><text x="1062.5" y="897" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">10: Lỗi hóa đơn</text><text x="697.5" y="959" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">11: Từ chối minh chứng</text><text x="75" y="1029" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Hóa đơn còn số phải thu]</text><text x="1427.5" y="1078" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">12: Tính tổng minh chứng chờ</text><text x="1427.5" y="1107" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">duyệt</text><text x="1427.5" y="1169" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">13: Tổng tiền minh chứng chờ</text><text x="1427.5" y="1198" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">duyệt</text><text x="158" y="1258" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Số tiền minh chứng vượt số còn phải thu sau khi trừ phần chờ duyệt]</text><text x="1427.5" y="1307" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">14: Hủy các thay đổi chưa lưu</text><text x="1062.5" y="1369" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">15: Minh chứng vượt hạn mức</text><text x="1062.5" y="1398" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">gửi</text><text x="697.5" y="1460" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">16: Vượt hạn mức gửi</text><text x="87" y="1530" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Số tiền trong hạn mức]</text><text x="1427.5" y="1579" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">17: Lưu minh chứng chờ duyệt</text><text x="1427.5" y="1641" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">18: Minh chứng đã được lưu</text><text x="1062.5" y="1703" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">19: Minh chứng đã gửi</text><text x="697.5" y="1765" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">20: Đang chờ Chủ trọ duyệt</text><text x="332.5" y="1827" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">21: Hiển thị trạng thái chờ</text><text x="106.5" y="1256" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="94.5" y="784" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="150.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal">Người thuê</text><text x="515.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Biểu mẫu minh chứng</text><text x="880.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">TenantPortalController</text><text x="1245.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">TenantPortalService</text><t