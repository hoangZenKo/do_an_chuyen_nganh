hor="middle" font-weight="normal">thuê</text><text x="75" y="708" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Phòng chưa có hợp đồng hiệu lực]</text><text x="1427.5" y="757" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">7: Lưu hợp đồng có hiệu lực</text><text x="1427.5" y="819" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">8: Hợp đồng mới</text><text x="158" y="879" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Tiền cọc &gt; 0]</text><text x="1427.5" y="928" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">9: Ghi nhận khoản thu cọc ban</text><text x="1427.5" y="957" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">đầu</text><text x="106.5" y="877" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">opt</text><text x="1427.5" y="1041" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">10: Cập nhật phòng thành</text><text x="1427.5" y="1070" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">Đang thuê</text><text x="1427.5" y="1132" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">11: Xác nhận lưu toàn bộ dữ</text><text x="1427.5" y="1161" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">liệu</text><text x="1062.5" y="1223" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">12: Hợp đồng đã lưu</text><text x="820.0" y="1282" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">ref</text><text x="1278.0" y="1292" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Ghi nhật ký tạo hợp đồng sau khi lưu thành công</text><text x="697.5" y="1362" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">13: Tạo hợp đồng thành công</text><text x="332.5" y="1424" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">14: Hiển thị hợp đồng</text><text x="94.5" y="343" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="150.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal">Chủ trọ</text><text x="515.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Biểu mẫu hợp đồng</text><text x="880.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">LeasesController</text><text x="1245.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">LeasesService</text><text x="1610.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Cơ sở dữ liệu</text></svg>