yline points="887,357 1238,357" fill="none" stroke="#800000" stroke-width="1.5" marker-end="url(#block)" /><polyline points="1252,448 1337,448 1337,467 1252,467" fill="none" stroke="#800000" stroke-width="1.5" marker-end="url(#block)" /><polyline points="1252,525 1603,525" fill="none" stroke="#800000" stroke-width="1.5" marker-end="url(#block)" /><polyline points="1603,616 1252,616" fill="none" stroke="#800000" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#open)" /><rect fill="#FFFFFF" stroke="none" stroke-width="1.5" x="146" y="644" width="971.96875" height="27" /><polyline points="1252,725 1603,725" fill="none" stroke="#800000" stroke-width="1.5" marker-end="url(#block)" /><polyline points="1238,787 887,787" fill="none" stroke="#800000" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#open)" /><polyline points="873,849 522,849" fill="none" stroke="#800000" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#open)" /><polyline points="508,911 157,911" fill="none" stroke="#800000" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#open)" /><rect fill="#FFFFFF" stroke="none" stroke-width="1.5" x="75" y="949" width="572.0" height="27" /><text x="332.5" y="194" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">1: Xác nhận khoản thu</text><text x="697.5" y="256" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">2: Gửi thông tin khoản thanh</text><text x="697.5" y="285" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">toán</text><text x="1062.5" y="347" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">3: Yêu cầu ghi nhận thanh</text><text x="1062.5" y="376" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">toán</text><text x="1269" y="409" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">4: Xác định thời điểm thanh</text><text x="1269" y="438" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">toán</text><text x="1427.5" y="515" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">5: Tra cứu hóa đơn và số dư</text><text x="1427.5" y="577" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">6: Hóa đơn thuộc phạm vi</text><text x="1427.5" y="606" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">quản lý</text><text x="146" y="666" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Không tìm thấy hóa đơn, hóa đơn đã hủy, đã thanh toán đủ hoặc khoản thu vượt số còn phải thu]</text><text x="1427.5" y="715" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">7: Hủy các thay đổi chưa lưu</text><text x="1062.5" y="777" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">8: Lỗi hóa đơn hoặc số dư</text><text x="697.5" y="839" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">9: Khoản thu bị từ chối</text><text x="332.5" y="901" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">10: Hiển thị lỗi</text><text x="75" y="971" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Số tiền thanh toán hợp lệ và không vượt số còn phải thu]</text><text x="455.0" y="1017" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">ref</text><text x="1095.5" y="1027" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">SD-07B Tiếp tục ghi nhận cùng khoản thanh toán</text><text x="94.5" y="664" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="150.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal">Chủ trọ</text><text x="515.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Màn hình chi tiết hóa đơn</text><text x="880.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">BillingController</text><text x="1245.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">BillingService</text><text x="1610.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Cơ sở dữ liệu</text></svg>