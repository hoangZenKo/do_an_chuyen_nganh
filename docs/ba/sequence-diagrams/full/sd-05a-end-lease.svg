rial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">quản lý</text><text x="1427.5" y="530" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">5: Kết quả tra cứu hợp đồng</text><text x="146" y="590" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Không tìm thấy trong phạm vi]</text><text x="1427.5" y="639" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">6: Hủy các thay đổi chưa lưu</text><text x="1062.5" y="701" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">7: Không tìm thấy hợp đồng</text><text x="697.5" y="763" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">8: Từ chối kết thúc</text><text x="75" y="833" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Tìm thấy hợp đồng]</text><text x="1427.5" y="882" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">9: Đánh dấu hợp đồng đã kết</text><text x="1427.5" y="911" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">thúc</text><text x="1427.5" y="973" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">10: Tra cứu hợp đồng còn</text><text x="1427.5" y="1002" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">hiệu lực</text><text x="1427.5" y="1064" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">11: Hợp đồng còn hiệu lực</text><text x="158" y="1124" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Không còn hợp đồng hiệu lực của phòng]</text><text x="1427.5" y="1173" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">12: Cập nhật phòng thành</text><text x="1427.5" y="1202" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">Trống</text><text x="87" y="1272" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Phòng còn hợp đồng hiệu lực khác]</text><text x="1269" y="1321" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">13: Giữ trạng thái phòng</text><text x="106.5" y="1122" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="1427.5" y="1420" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">14: Xác nhận lưu toàn bộ dữ</text><text x="1427.5" y="1449" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">liệu</text><text x="1062.5" y="1511" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">15: Hợp đồng đã kết thúc</text><text x="820.0" y="1570" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">ref</text><text x="1278.0" y="1580" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Ghi nhật ký kết thúc hợp đồng</text><text x="697.5" y="1650" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">16: Kết quả kết thúc</text><text x="332.5" y="1712" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">17: 