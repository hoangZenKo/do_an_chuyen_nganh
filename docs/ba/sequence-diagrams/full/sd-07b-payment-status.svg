rial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">thanh toán</text><text x="146" y="451" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Tổng tiền đã thanh toán &lt; Tổng tiền hóa đơn]</text><text x="1427.5" y="500" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">4: Ghi nhận thanh toán một</text><text x="1427.5" y="529" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">phần</text><text x="75" y="599" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Tổng tiền đã thanh toán = Tổng tiền hóa đơn]</text><text x="1427.5" y="648" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">5: Ghi nhận đã thanh toán đủ</text><text x="94.5" y="449" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="1427.5" y="732" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">6: Xác nhận lưu toàn bộ dữ</text><text x="1427.5" y="761" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">liệu</text><text x="1062.5" y="794" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">7: Hóa đơn và khoản thanh</text><text x="1062.5" y="823" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">toán</text><text x="820.0" y="882" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">ref</text><text x="1278.0" y="892" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Ghi nhật ký ghi nhận thanh toán</text><text x="697.5" y="962" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">8: Kết quả thu tiền</text><text x="332.5" y="1024" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">9: Hiển thị số dư mới</text><text x="150.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal">Chủ trọ</text><text x="515.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Màn hình chi tiết hóa đơn</text><text x="880.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">BillingController</text><text x="1245.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">BillingService</text><text x="1610.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Cơ sở dữ liệu</text></svg>