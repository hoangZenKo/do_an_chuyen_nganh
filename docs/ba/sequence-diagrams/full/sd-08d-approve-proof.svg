="1252,1110 1603,1110" fill="none" stroke="#800000" stroke-width="1.5" marker-end="url(#block)" /><rect fill="#FFFFFF" stroke="none" stroke-width="1.5" x="87" y="1148" width="469.0" height="27" /><polyline points="1252,1229 1603,1229" fill="none" stroke="#800000" stroke-width="1.5" marker-end="url(#block)" /><text x="1427.5" y="224" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">1: Tra cứu hóa đơn thuộc</text><text x="1427.5" y="253" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">quản lý</text><text x="1427.5" y="315" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">2: Hóa đơn và số còn phải thu</text><text x="146" y="375" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Không tìm thấy hóa đơn, hóa đơn đã hủy, đã thanh toán đủ hoặc minh chứng vượt số còn phải thu]</text><text x="158" y="422" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Không tìm thấy hóa đơn, hóa đơn đã hủy, đã thanh toán đủ hoặc minh chứng vượt số còn phải thu]</text><text x="1427.5" y="471" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">3: Hủy toàn bộ thay đổi chưa</text><text x="1427.5" y="500" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">lưu</text><text x="1062.5" y="562" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">4: Lỗi hóa đơn hoặc số dư</text><text x="697.5" y="624" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">5: Duyệt bị từ chối</text><text x="332.5" y="686" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">6: Hiển thị lỗi xét duyệt</text><text x="106.5" y="420" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">break</text><text x="75" y="778" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Hóa đơn cho phép thu]</text><text x="1427.5" y="827" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">7: Ghi nhận thanh toán từ</text><text x="1427.5" y="856" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">minh chứng</text><text x="1269" y="918" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">8: Tính tổng tiền đã thanh</text><text x="1269" y="947" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="start" font-weight="normal">toán</text><text x="158" y="1022" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Tổng tiền đã thanh toán &lt; Tổng tiền hóa đơn]</text><text x="1427.5" y="1071" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">9: Ghi nhận thanh toán một</text><text x="1427.5" y="1100" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">phần</text><text x="87" y="1170" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Tổng tiền đã thanh toán = Tổng tiền hóa đơn]</text><text x="1427.5" y="1219" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">10: Ghi nhận đã thanh toán đủ</text><text x="106.5" y="1020" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="455.0" y="1300" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">ref</text><text x="1095.5" y="1310" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Trở về SD-08C Lưu kết quả chấp thuận minh chứng</text><text x="94.5" y="373" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold">alt</text><text x="150.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal">Chủ trọ</text><text x="515.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Màn hình duyệt minh</text><text x="515.0" y="166" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">chứng</text><text x="880.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">BillingController</text><text x="1245.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">BillingService</text><text x="1610.0" y="136" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" text-decoration="underline">Cơ sở dữ liệu</text></svg>