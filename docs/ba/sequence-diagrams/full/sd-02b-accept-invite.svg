 font-weight="normal">10: Tạo tài khoản người thuê</text><text x="158" y="1008" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Email đã được đăng ký]</text><text x="1427.5" y="1057" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">11: Dữ liệu trùng; hủy thay đổi</text><text x="1062.5" y="1119" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">12: Email đã được đăng ký</text><text x="697.5" y="1181" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">13: Không tạo tài khoản</text><text x="87" y="1251" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">[Tài khoản được tạo thành công]</text><text x="1427.5" y="1300" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">14: Liên kết tài khoản với hồ</text><text x="1427.5" y="1329" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">sơ</text><text x="1427.5" y="1391" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">15: Đánh dấu lời mời đã sử</text><text x="1427.5" y="1420" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">dụng</text><text x="1427.5" y="1482" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">16: Xác nhận lưu toàn bộ dữ</text><text x="1427.5" y="1511" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal">liệu</text><text x="820.0" y="1570" fill="#000000" font-family="Tahoma, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold