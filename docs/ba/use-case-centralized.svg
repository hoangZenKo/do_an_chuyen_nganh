  <ellipse id="UC_BIL_06" class="billing" cx="1080" cy="1054" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="1054">UC-BIL-06 Xem báo cáo tháng</text>
  <ellipse id="UC_BIL_07" class="billing" cx="1080" cy="1102" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="1102">UC-BIL-07 Gửi thông báo / nhắc nợ</text>
  <ellipse id="UC_TEN_01" class="tenant" cx="1080" cy="1174" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="1174">UC-TEN-01 Xem thông tin thuê phòng</text>
  <ellipse id="UC_TEN_02" class="tenant" cx="1080" cy="1222" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="1222">UC-TEN-02 Xem hợp đồng thuê</text>
  <ellipse id="UC_TEN_03" class="tenant" cx="1080" cy="1270" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="1270">UC-TEN-03 Xem hóa đơn</text>
  <ellipse id="UC_TEN_04" class="tenant" cx="1080" cy="1318" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="1318">UC-TEN-04 Gửi minh chứng thanh toán</text>
  <ellipse id="UC_TEN_05" class="tenant" cx="1080" cy="1366" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="1366">UC-TEN-05 Gửi yêu cầu bảo trì</text>
  <ellipse id="UC_TEN_06" class="tenant" cx="1080" cy="1414" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="1414">UC-TEN-06 Xem thông báo</text>

  <g transform="translate(170 650)">
    <circle class="actor-line" cx="0" cy="0" r="27"/>
    <path class="actor-line" d="M0 27 L0 105 M-55 58 L55 58 M0 105 L-48 176 M0 105 L48 176"/>
