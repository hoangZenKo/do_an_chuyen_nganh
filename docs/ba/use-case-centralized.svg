  <text class="uc-text" x="1080" y="430">UC-ADM-03 Quản lý khu trọ toàn hệ thống</text>
  <ellipse id="UC_OPT_01" class="operation" cx="1080" cy="502" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="502">UC-OPT-01 Xem dashboard vận hành</text>
