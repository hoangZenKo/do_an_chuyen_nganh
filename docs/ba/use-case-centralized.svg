<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
    <style>
      .bg { fill: #ffffff; }
      .grid { fill: url(#grid); }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .boundary { fill: rgba(255,255,255,0.74); stroke: #111827; stroke-width: 2.4; }
      .boundary-title { font: 700 18px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .uc-text { font: 700 15px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .actor-label { font: 700 17px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .actor-line { stroke: #111827; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .assoc { stroke: #94a3b8; stroke-width: 1.25; fill: none; opacity: 0.55; }
      .sys { fill: #fff; stroke: #ef4444; stroke-width: 2.1; }
      .admin { fill: #fff; stroke: #64748b; stroke-width: 2.1; }
      .operation { fill: #fff; stroke: #f59e0b; stroke-width: 2.1; }
      .billing { fill: #fff; stroke: #3b82f6; stroke-width: 2.1; }
      .tenant { fill: #fff; stroke: #22c55e; stroke-width: 2.1; }
    </style>
  </defs>

  <rect class="bg" width="2400" height="1500"/>
  <rect class="grid" width="2400" height="1500"/>
  <text class="title" x="1200" y="72">Sơ đồ Use Case tổng quan - Hệ thống quản lý nhà trọ</text>
  <rect class="boundary" x="420" y="120" width="1320" height="1320"/>
  <text class="boundary-title" x="1080" y="158">Biên hệ thống: Hệ thống quản lý nhà trọ</text>

  <ellipse id="UC_SYS_01" class="sys" cx="1080" cy="220" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="220">UC-SYS-01 Đăng nhập</text>
  <ellipse id="UC_SYS_02" class="sys" cx="1080" cy="268" rx="490" ry="24"/>
  <text class="uc-text" x="1080" y="268">UC-SYS-02 Đăng xuất</text>
  <ellipse id="UC_ADM_01" class="admin" cx="1080" cy="334" rx="490" ry="24"/>
