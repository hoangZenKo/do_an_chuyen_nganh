  <text x="500" y="919" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#222222">Đường liền là liên kết actor với UC   Phân nhóm theo danh mục UC tổng quan</text>
