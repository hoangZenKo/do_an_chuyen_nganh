  <title id="diagram-title">D-TEN-01 Cổng thông tin Người thuê</title>
  <desc id="diagram-description">Actor nằm ngoài biên hệ thống. Đường liền biểu thị actor tham gia UC. Khung nét đứt chỉ nhóm phân rã theo UC tổng quan. Các UC: UC-TEN-01, UC-TEN-02, UC-TEN-03, UC-TEN-04, UC-TEN-05.01, UC-TEN-05.02, UC-TEN-06</desc>
