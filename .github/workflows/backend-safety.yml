name: Backend Safety
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-safety.yml']
  push:
    paths: ['backend/**', '.github/workflows/backend-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rental_test
          POSTGRES_PASSWORD: rental_ci_test_only
          POSTGRES_DB: rental_chatbot_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rental_test -d rental_chatbot_test_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rental_test:rental_ci_test_only@localhost:5432/rental_chatbot_test_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-outside-tests
      ADMIN_MFA_REQUIRED: 'false'
      DELIVERY_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate && npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run build && npm test -- --runInBand
      - run: npm run test:e2e
      - run: npm run test:safety-scripts
